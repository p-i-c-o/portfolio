<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Connect with Elie</title>
    <link rel="stylesheet" href="../styles.css">
</head>
<body>
<main class="container connect-page">
    <section class="block">
        <div class="header path-header">~/connect</div>
        <div class="body connect-intro">
            <p class="connect-prompt">Hi, I'm Elie.</p>
            <p>BSc Cybersecurity student, Linux enthusiast, and habitual self-hoster.</p>
        </div>
    </section>

    <section class="block">
        <div class="header">Find Me Online</div>
        <div class="body contact-links">
            <a class="contact-link" href="https://monnickendam.ch" target="_blank" rel="noopener noreferrer">
                <span class="contact-label">Website</span>
                <span class="contact-value">monnickendam.ch</span>
                <span aria-hidden="true">-&gt;</span>
            </a>
            <a class="contact-link" href="https://linkedin.com/in/monnickendam" target="_blank" rel="noopener noreferrer">
                <span class="contact-label">LinkedIn</span>
                <span class="contact-value">in/monnickendam</span>
                <span aria-hidden="true">-&gt;</span>
            </a>
            <a class="contact-link" href="https://github.com/p-i-c-o" target="_blank" rel="noopener noreferrer">
                <span class="contact-label">GitHub</span>
                <span class="contact-value">p-i-c-o</span>
                <span aria-hidden="true">-&gt;</span>
            </a>
            <a class="contact-link" href="../blog/">
                <span class="contact-label">Blog</span>
                <span class="contact-value">Projects &amp; writing</span>
                <span aria-hidden="true">-&gt;</span>
            </a>
        </div>
    </section>

    <section class="block">
        <div class="header">Send a Message</div>
        <div class="body contact">
            <form method="post">
                <label for="email">Your email</label>
                <div class="row">
                    <input
                        id="email"
                        name="email"
                        type="email"
                        required
                        autocomplete="email"
                        placeholder="you@domain.com"
                        class="email-box"
                    >
                </div>

                <label for="message">Message</label>
                <div class="row">
                    <textarea
                        id="message"
                        name="message"
                        required
                        rows="6"
                        placeholder="Write your message here…"
                        class="message-box"
                    ></textarea>
                </div>

                <div class="actions">
                    <button type="submit" class="send-box">Send</button>
                </div>
            </form>
        </div>
    </section>
</main>

<script src="../contact.js"></script>
</body>
</html>
