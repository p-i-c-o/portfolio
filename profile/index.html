<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile | monnickendam.ch</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../styles.css?v=comments14">
  <script defer src="../comment-api.js?v=1"></script>
  <script defer src="../profile.js?v=2"></script>
</head>
<body>
<main class="container profile-page">
  <div class="banner"><img src="../assets/banner.png" alt=""></div>
  <div class="block">
    <div class="header path-header"><a href="../index.html">home</a>/<a href="../blog/">blog</a>/profile</div>
    <div class="body profile-summary">
      <div class="profile-avatar" aria-hidden="true"></div>
      <div><h1 class="profile-name">Profile</h1><p class="profile-meta"></p></div>
    </div>
  </div>
  <section class="block" aria-labelledby="profile-comments-title">
    <h2 class="header" id="profile-comments-title">Public comments</h2>
    <div class="body account-card">
      <div class="profile-comments" role="status" aria-live="polite">Loading…</div>
      <p class="profile-status" role="status" aria-live="polite"></p>
      <button class="profile-retry retry-button" type="button" hidden>Try again</button>
      <button class="profile-more" type="button" hidden>Load more comments</button>
    </div>
  </section>
</main>
</body>
</html>
